<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#c9a96e" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Static SEO tags below are a fallback for crawlers that don't execute
      JavaScript (social preview bots, curl). Every routed page renders its
      own title/description/OG tags via PageHead (React 19 head hoisting),
      so main.tsx removes everything marked data-static-seo at boot —
      otherwise JS-rendering crawlers (Googlebot) would see duplicates and,
      worse, conflicting signals. Never add a static canonical here: a
      canonical pointing at "/" served on every route tells Google that all
      pages are the homepage.
    -->
    <title data-static-seo>The RoStory | Visual Storytelling about Romania</title>
    <meta data-static-seo name="description" content="Discover Romania through captivating visual stories about culture, history, traditions, and hidden gems from every corner of the country." />
    <meta name="author" content="The RoStory" />

    <!-- Open Graph -->
    <meta data-static-seo property="og:type" content="website" />
    <meta data-static-seo property="og:title" content="The RoStory | Visual Storytelling about Romania" />
    <meta data-static-seo property="og:description" content="Discover Romania through captivating visual stories about culture, history, traditions, and hidden gems from every corner of the country." />
    <meta data-static-seo property="og:url" content="https://therostory.com/" />
    <meta data-static-seo property="og:site_name" content="The RoStory" />
    <meta data-static-seo property="og:image" content="https://therostory.com/og-image.jpg" />
    <meta data-static-seo property="og:image:width" content="1200" />
    <meta data-static-seo property="og:image:height" content="630" />
    <meta data-static-seo property="og:image:alt" content="The RoStory — Visual storytelling about Romania" />
    <meta data-static-seo property="og:locale" content="en_US" />
    <meta data-static-seo property="og:locale:alternate" content="ro_RO" />

    <!-- Twitter Card -->
    <meta data-static-seo name="twitter:card" content="summary_large_image" />
    <meta data-static-seo name="twitter:title" content="The RoStory | Visual Storytelling about Romania" />
    <meta data-static-seo name="twitter:description" content="Discover Romania through captivating visual stories — culture, history, traditions, and hidden gems." />
    <meta data-static-seo name="twitter:image" content="https://therostory.com/og-image.jpg" />
  </head>
  <body>
    <noscript>
      <div style="font-family: Georgia, serif; max-width: 640px; margin: 80px auto; padding: 0 24px; text-align: center; color: #f4ead7; line-height: 1.6;">
        <h1 style="font-style: italic; font-size: 32px; margin-bottom: 16px;">The RoStory</h1>
        <p>This site needs JavaScript to display its visual stories. Please enable JavaScript in your browser, or visit again with a modern browser.</p>
        <p style="font-style: italic; opacity: 0.7;">Acest site are nevoie de JavaScript. Te rugăm să-l activezi în browser.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
