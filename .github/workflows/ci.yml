name: CI

# Everything here runs without a single repository secret, which is the
# point: no fork PR can fail for want of access to something.
#
# It is NOT true that the suite only fails on our own changes — the audit
# steps deliberately break when an advisory is published upstream against a
# tree we have not touched. That is the whole reason they exist, and it is
# the one class of red build here that is news rather than a mistake.
#
# vitest.config.ts hard-codes dummy Supabase credentials for `test.env`, so
# the unit tests reach nothing real. The browser suite (`npm run test:e2e`)
# is deliberately NOT here — it builds the app and needs the real
# VITE_SUPABASE_* values to render anything, so it would need secrets and
# would go red on every fork PR. Run it locally before deploying, or add a
# second workflow once those secrets exist.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the version this project is developed against.
          node-version: '26'
          cache: npm

      # `ci`, not `install`: fails loudly if package-lock.json and
      # package.json have drifted apart, rather than quietly resolving.
      - name: Install dependencies
        run: npm ci

      # Split rather than `npm run lint` so a failure names itself in the
      # step list instead of hiding inside one collapsed block.
      - name: Typecheck (src, middleware, api)
        run: npm run lint:types

      - name: ESLint
        run: npm run lint:js

      - name: Stylelint
        run: npm run lint:css

      - name: Unit tests
        run: npm test

      # Cheap, and catches the class of break that only shows up when Vite
      # actually resolves and bundles every import.
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: build-time-placeholder-not-a-credential

      # Audit last, on purpose. These are the only steps that can go red
      # because of something published upstream rather than something in the
      # diff, so running them after the code checks means a genuine breakage
      # always surfaces first instead of being masked by a fresh advisory.
      #
      # Split into two steps so a red build names which tree is affected
      # without opening the log: the first ships to readers, the second does
      # not. --audit-level=low is npm's own default, stated explicitly so a
      # future change to that default cannot quietly loosen the gate.

      # Blocking, with no exceptions: these packages are in the bundle users
      # download.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      # Also blocking. Fails on any advisory except the few named in
      # scripts/audit.mjs, each a build-tool advisory with no patched release
      # and a stated reason it can't reach a reader (README, "Dependency
      # advisories"). A plain `npm audit` here was red for good the day
      # picomatch published an advisory it had no fix for.
      - name: Audit full dependency tree (including dev)
        run: npm run audit:all

  # Separate job: different toolchain, and a jsr.io/esm.sh hiccup should name
  # itself rather than fail the job that checks the app.
  #
  # These seven functions hold the newsletter double opt-in, the Svix signature
  # check and every service-role code path in the project, and nothing in CI
  # had ever type-checked them — `npm run lint` cannot, because tsc can't
  # resolve their jsr:/https: specifiers (see README, "Available Scripts").
  # A broken edge function deploys silently and fails in production.
  edge:
    name: Type-check edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          # Matches edge_runtime.deno_version in supabase/config.toml.
          deno-version: v2.x

      # Deliberately no `npm ci`. deno.check.json sets nodeModulesDir "none"
      # precisely so the functions never resolve out of the repo's
      # node_modules (README explains the npm:openai failure that caused).
      # Not installing it at all makes that guarantee structural here.
      - name: Deno check
        run: npm run lint:edge

      # The functions' own unit tests (Resend is faked; no network, no secrets).
      - name: Deno test
        run: npm run test:edge

  # The browser suite (e2e/): accessibility (axe), keyboard paths, the
  # Atlas, story features and the editors' unsaved copy, on a desktop and a
  # phone, against a real production build served by `vite preview`.
  #
  # It reads the live archive, so it needs the site's public Supabase URL and
  # publishable key as repository secrets (Settings → Secrets and variables →
  # Actions): VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY. Both are already
  # public in every page the site serves; they are secrets here only to keep
  # them out of the workflow file. Every write the tests make is intercepted
  # in the browser, and a view counted from CI's origin is refused by
  # increment-view, so the run changes nothing in production. Until the
  # secrets exist the job says so and passes, rather than failing every push.
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Skip without the Supabase secrets
        if: ${{ env.VITE_SUPABASE_URL == '' }}
        run: echo "::notice::Browser tests skipped — add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as repository secrets to run them."

      - uses: actions/checkout@v5
        if: ${{ env.VITE_SUPABASE_URL != '' }}

      - uses: actions/setup-node@v5
        if: ${{ env.VITE_SUPABASE_URL != '' }}
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        if: ${{ env.VITE_SUPABASE_URL != '' }}
        run: npm ci

      - name: Install Chromium
        if: ${{ env.VITE_SUPABASE_URL != '' }}
        run: npx playwright install --with-deps chromium

      - name: Playwright
        if: ${{ env.VITE_SUPABASE_URL != '' }}
        run: npm run test:e2e

      - name: Keep the report of a failed run
        if: ${{ failure() && env.VITE_SUPABASE_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/.results
          retention-days: 7
